plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bizard.homesmokemqtt.legacy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bizard.homesmokemqtt.legacy'
        minSdk 14
        targetSdk 19
        versionCode 10
        versionName '2.6.0-legacy4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
