plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bizard.homesmokemqtt'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bizard.homesmokemqtt.full'
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName '2.6.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
