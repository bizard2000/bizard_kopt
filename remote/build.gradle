plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def stableDebugKeystore = file('homesmoke-remote-debug.keystore')
def stableDebugKeystoreB64 = rootProject.file('ci/homesmoke-debug.keystore.b64')
if (!stableDebugKeystore.exists()) {
    if (!stableDebugKeystoreB64.exists()) {
        throw new GradleException('Missing ci/homesmoke-debug.keystore.b64')
    }
    stableDebugKeystore.bytes = stableDebugKeystoreB64.text.trim().decodeBase64()
}

android {
    namespace 'com.bizard.homesmokeremote'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile stableDebugKeystore
            storePassword 'homesmoke'
            keyAlias 'homesmoke'
            keyPassword 'homesmoke'
        }
    }

    defaultConfig {
        applicationId 'com.bizard.homesmokeremote'
        minSdk 23
        targetSdk 35
        versionCode 40
        versionName '2.4.2'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
}
