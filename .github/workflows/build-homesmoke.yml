name: Build HomeSmoke MQTT APK

on:
  push:
    branches: [ homesmoke-native ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: homesmoke-native

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Android 16 UI, input-dialog and sliding-sidebar fixes
        run: python3 ci/patch_android16_ui.py

      - name: Build APK and capture log
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish build result into branch
        shell: bash
        run: |
          mkdir -p dist
          cp build.log dist/build.log
          if [ "${{ steps.build.outputs.status }}" = "0" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.0.2_Android16.apk
            cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.0.2_Android16.bin
            cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_MQTT_Android16.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "CI: publish HomeSmoke 2.0.2 build result [skip ci]" || true
          git push origin homesmoke-native

      - name: Fail workflow if build failed
        if: steps.build.outputs.status != '0'
        run: exit 1

      - name: Upload build artifacts
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.0.2_Android16
          path: |
            dist/HomeSmoke_FULL_2.0.2_Android16.apk
            dist/HomeSmoke_FULL_2.0.2_Android16.bin
          if-no-files-found: error
