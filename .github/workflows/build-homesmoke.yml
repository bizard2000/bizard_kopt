name: Build HomeSmoke MQTT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HomeSmoke branch
        uses: actions/checkout@v4
        with:
          ref: homesmoke-native

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Android 16 UI fixes
        run: python3 ci/patch_android16_ui.py

      - name: Apply exact Homesmoke.aia protocol mapping
        run: python3 ci/patch_protocol_mapping.py

      - name: Add MQTT remote-control gateway
        run: python3 ci/patch_remote_gateway.py

      - name: Build HomeSmoke and Remote
        run: gradle :app:assembleDebug :remote:assembleDebug --stacktrace

      - name: Upload HomeSmoke APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.1.0_Android16
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload HomeSmoke Remote APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_Remote_1.0.0_Android5plus
          path: remote/build/outputs/apk/debug/remote-debug.apk
