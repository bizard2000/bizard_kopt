name: Build HomeSmoke modern and Remote

on:
  push:
    branches: [ homesmoke-native ]
  workflow_dispatch:

concurrency:
  group: homesmoke-native-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homesmoke-native
        uses: actions/checkout@v4
        with:
          ref: homesmoke-native

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test shared protocol and Auto core
        shell: bash
        run: |
          set -o pipefail
          gradle :core:test --stacktrace 2>&1 | tee core-test.log

      - name: Test HomeSmoke Android logic
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee app-test.log

      - name: Test Remote logic and Kotlin migration
        shell: bash
        run: |
          set -o pipefail
          gradle :remote:testDebugUnitTest --stacktrace 2>&1 | tee remote-test.log

      - name: Verify HomeSmoke 2.6.13 Kotlin field diagnostics
        shell: bash
        run: |
          grep -q "minSdk 23" app/build.gradle
          grep -q "versionCode 23" app/build.gradle
          grep -q "versionName '2.6.13'" app/build.gradle
          grep -q "org.jetbrains.kotlin.android" build.gradle
          grep -q "org.jetbrains.kotlin.android" app/build.gradle
          grep -q "testImplementation 'junit:junit:4.13.2'" app/build.gradle
          test -f app/src/main/java/com/bizard/homesmokemqtt/FieldTestRecorder.kt
          test -f app/src/main/java/com/bizard/homesmokemqtt/FieldTestActivity.kt
          test -f app/src/main/java/com/bizard/homesmokemqtt/FieldTestLifecycleProvider.kt
          grep -q 'HomeSmoke · Полевой тест' app/src/main/AndroidManifest.xml
          grep -q 'REMOTE_SETPOINT_ACK' app/src/main/java/com/bizard/homesmokemqtt/FieldTestRecorder.kt
          grep -q 'controller_ack_timeout' app/src/main/java/com/bizard/homesmokemqtt/CommandAckManager.java
          grep -q 'autoStatus="Команда STOP отправлена"' app/src/main/java/com/bizard/homesmokemqtt/HomeSmokeService.java
          grep -q 'autoStatus="STOP не отправлен"' app/src/main/java/com/bizard/homesmokemqtt/HomeSmokeService.java
          grep -q 'else if("stop".equals(cmd)){stopHeating();publishAck(requestId,cmd,true,"stop_sent",Double.NaN);}' app/src/main/java/com/bizard/homesmokemqtt/HomeSmokeService.java
          grep -q 'ModernHomeSmokeActivity.class' app/src/main/java/com/bizard/homesmokemqtt/HomeSmokeService.java
          grep -q 'ackTimeoutSweep' app/src/main/java/com/bizard/homesmokemqtt/HomeSmokeService.java
          grep -q 'latest=null' app/src/main/java/com/bizard/homesmokemqtt/HomeSmokeService.java
          grep -q 'mqttAttempt' app/src/main/java/com/bizard/homesmokemqtt/HomeSmokeService.java
          grep -q 'KEEPALIVE_TIMEOUT_MS' app/src/main/java/com/bizard/homesmokemqtt/MqttClient.java
          grep -q 'auto_library_json_v2_backup' app/src/main/java/com/bizard/homesmokemqtt/ProgramRepository.java
          grep -q 'expiresWithoutAnyTelemetry' app/src/test/java/com/bizard/homesmokemqtt/CommandAckManagerTest.java
          grep -q 'Android 4 / Legacy is excluded' AUDIT_STABILIZATION_PLAN_2_6.md
          test -f AUDIT_HOMESMOKE_2_6_12.md
          test -f FIELD_TEST_HOMESMOKE_2_6_13.md
          grep -E "minSdk|versionCode|versionName" app/build.gradle

      - name: Build HomeSmoke 2.6.13 Android 6+
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee app-build.log

      - name: Verify HomeSmoke Remote 2.3.0 Compose configuration
        shell: bash
        run: |
          grep -q "minSdk 23" remote/build.gradle
          grep -q "versionCode 35" remote/build.gradle
          grep -q "versionName '2.3.0'" remote/build.gradle
          ! grep -q "com.google.android.material" remote/build.gradle
          grep -q "android:style/Theme.Material.Light.NoActionBar" remote/src/main/res/values/styles.xml
          grep -q 'android:name=".RemoteApplication"' remote/src/main/AndroidManifest.xml
          grep -q "org.jetbrains.kotlin.android" remote/build.gradle
          grep -q "org.jetbrains.kotlin.plugin.compose" remote/build.gradle
          grep -q "androidx.compose.material3:material3" remote/build.gradle
          test -f remote/src/main/java/com/bizard/homesmokeremote/ModernComposeOverlay.kt
          test "$(find remote/src/main -name '*.java' | wc -l)" -eq 0
          test "$(find remote/src/main -name '*.kt' | wc -l)" -eq 14
          for cls in MainActivity GraphUxActivity GraphUxFixActivity HistoryActivity SessionDetailActivity SystemStatusActivity RemoteApplication MqttClient SecretStore TelemetryHistoryStore OperationalHistoryStore SessionAnalytics TemperatureChartView; do
            test -f "remote/src/main/java/com/bizard/homesmokeremote/$cls.kt"
          done
          grep -E "minSdk|versionCode|versionName" remote/build.gradle

      - name: Build HomeSmoke Remote 2.3.0 Android 6+ Compose UI
        shell: bash
        run: |
          set -o pipefail
          gradle :remote:assembleDebug --stacktrace 2>&1 | tee remote-build.log

      - name: Verify APK outputs
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s remote/build/outputs/apk/debug/remote-debug.apk
          python3 ci/verify_remote_apk.py remote/build/outputs/apk/debug/remote-debug.apk
          echo "APK outputs verified"

      - name: Publish successful build into homesmoke-native
        shell: bash
        run: |
          mkdir -p dist
          cat core-test.log app-test.log remote-test.log app-build.log remote-build.log > dist/build.log
          rm -f dist/HomeSmoke_FULL_2.6.*_Android6plus.apk dist/HomeSmoke_FULL_2.6.*_Android6plus.bin
          rm -f dist/HomeSmoke_Remote_2.*_Android5plus.apk dist/HomeSmoke_Remote_2.*_Android5plus.bin
          rm -f dist/HomeSmoke_Remote_2.*_Android6plus.apk dist/HomeSmoke_Remote_2.*_Android6plus.bin
          rm -f dist/*Android4plus.apk dist/*Android4plus.bin
          cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.6.13_Android6plus.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.6.13_Android6plus.bin
          cp remote/build/outputs/apk/debug/remote-debug.apk dist/HomeSmoke_Remote_2.3.0_Android6plus.apk
          cp remote/build/outputs/apk/debug/remote-debug.apk dist/HomeSmoke_Remote_2.3.0_Android6plus.bin
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A dist app/build.gradle remote/build.gradle
          git commit -m "CI: publish HomeSmoke 2.6.13 and Remote 2.3.0 Compose [skip ci]" || true
          git pull --rebase origin homesmoke-native
          git push origin homesmoke-native

      - name: Upload HomeSmoke 2.6.13 Kotlin field diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.6.13_Android6plus
          path: |
            dist/HomeSmoke_FULL_2.6.13_Android6plus.apk
            dist/HomeSmoke_FULL_2.6.13_Android6plus.bin
          if-no-files-found: error

      - name: Upload HomeSmoke Remote 2.3.0 Compose
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_Remote_2.3.0_Android6plus
          path: |
            dist/HomeSmoke_Remote_2.3.0_Android6plus.apk
            dist/HomeSmoke_Remote_2.3.0_Android6plus.bin
          if-no-files-found: error
