name: Build HomeSmoke APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HomeSmoke branch
        uses: actions/checkout@v4
        with:
          ref: homesmoke-native

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Android 16 UI fixes
        run: python3 ci/patch_android16_ui.py

      - name: Apply exact AIA/Arduino protocol mapping
        run: python3 ci/patch_protocol_mapping.py

      - name: Add MQTT remote-control gateway
        run: python3 ci/patch_remote_gateway.py

      - name: Move automatic program to Android
        run: python3 ci/patch_android_auto.py

      - name: Create Android 4.x legacy HomeSmoke
        run: python3 ci/make_legacy_main.py

      - name: Build all APKs
        run: gradle :app:assembleDebug :legacy:assembleDebug :remote:assembleDebug --stacktrace

      - name: Upload HomeSmoke modern APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.2.0_Android16
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload HomeSmoke Android 4+ APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.2.0_Android4plus
          path: legacy/build/outputs/apk/debug/legacy-debug.apk

      - name: Upload HomeSmoke Remote APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_Remote_1.0.0_Android5plus
          path: remote/build/outputs/apk/debug/remote-debug.apk
