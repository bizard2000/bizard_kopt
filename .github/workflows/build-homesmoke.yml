name: Build HomeSmoke modern and Remote

on:
  push:
    branches: [ homesmoke-native ]
  workflow_dispatch:

concurrency:
  group: homesmoke-native-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homesmoke-native
        uses: actions/checkout@v4
        with:
          ref: homesmoke-native

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test shared protocol and Auto core
        shell: bash
        run: |
          set -o pipefail
          gradle :core:test --stacktrace 2>&1 | tee core-test.log

      - name: Build HomeSmoke 2.6.10 Android 6+
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee app-build.log

      - name: Verify HomeSmoke Remote 2.0.17 version
        shell: bash
        run: |
          grep -q "versionCode 19" remote/build.gradle
          grep -q "versionName '2.0.17'" remote/build.gradle
          grep -E "versionCode|versionName" remote/build.gradle

      - name: Build HomeSmoke Remote 2.0.17 Android 5+
        shell: bash
        run: |
          set -o pipefail
          gradle :remote:assembleDebug --stacktrace 2>&1 | tee remote-build.log

      - name: Verify APK outputs
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s remote/build/outputs/apk/debug/remote-debug.apk
          echo "APK outputs verified"

      - name: Publish successful build into homesmoke-native
        shell: bash
        run: |
          mkdir -p dist
          cat core-test.log app-build.log remote-build.log > dist/build.log
          rm -f dist/HomeSmoke_FULL_2.6.*_Android6plus.apk dist/HomeSmoke_FULL_2.6.*_Android6plus.bin
          rm -f dist/HomeSmoke_Remote_2.0.*_Android5plus.apk dist/HomeSmoke_Remote_2.0.*_Android5plus.bin
          rm -f dist/*Android4plus.apk dist/*Android4plus.bin
          cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.6.10_Android6plus.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.6.10_Android6plus.bin
          cp remote/build/outputs/apk/debug/remote-debug.apk dist/HomeSmoke_Remote_2.0.17_Android5plus.apk
          cp remote/build/outputs/apk/debug/remote-debug.apk dist/HomeSmoke_Remote_2.0.17_Android5plus.bin
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A dist remote/build.gradle
          git commit -m "CI: publish HomeSmoke 2.6.10 and Remote 2.0.17 [skip ci]" || true
          git pull --rebase origin homesmoke-native
          git push origin homesmoke-native

      - name: Upload HomeSmoke 2.6.10 modern
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.6.10_Android6plus
          path: |
            dist/HomeSmoke_FULL_2.6.10_Android6plus.apk
            dist/HomeSmoke_FULL_2.6.10_Android6plus.bin
          if-no-files-found: error

      - name: Upload HomeSmoke Remote 2.0.17
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_Remote_2.0.17_Android5plus
          path: |
            dist/HomeSmoke_Remote_2.0.17_Android5plus.apk
            dist/HomeSmoke_Remote_2.0.17_Android5plus.bin
          if-no-files-found: error
