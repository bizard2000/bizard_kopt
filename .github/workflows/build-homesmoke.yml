name: Verify HomeSmoke Android 4.x Legacy

on:
  pull_request_target:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'homesmoke-native')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HomeSmoke branch
        uses: actions/checkout@v4
        with:
          ref: homesmoke-native

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Android 16 UI fixes
        run: python3 ci/patch_android16_ui.py

      - name: Apply exact Homesmoke.aia protocol mapping
        run: python3 ci/patch_protocol_mapping.py

      - name: Add MQTT remote-control gateway
        run: python3 ci/patch_remote_gateway.py

      - name: Create Android 4.x legacy HomeSmoke
        run: python3 ci/make_legacy_main.py

      - name: Build legacy APK
        run: gradle :legacy:assembleDebug --stacktrace 2>&1 | tee legacy-build.log

      - name: Publish legacy APK and BIN into HomeSmoke branch
        run: |
          mkdir -p dist
          cp legacy-build.log dist/legacy-build.log
          cp legacy/build/outputs/apk/debug/legacy-debug.apk dist/HomeSmoke_FULL_2.1.0_Android4plus.apk
          cp legacy/build/outputs/apk/debug/legacy-debug.apk dist/HomeSmoke_FULL_2.1.0_Android4plus.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "CI: publish HomeSmoke Android 4+ legacy [skip ci]" || true
          git push origin homesmoke-native

      - name: Upload legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.1.0_Android4plus
          path: |
            dist/HomeSmoke_FULL_2.1.0_Android4plus.apk
            dist/HomeSmoke_FULL_2.1.0_Android4plus.bin
          if-no-files-found: error
