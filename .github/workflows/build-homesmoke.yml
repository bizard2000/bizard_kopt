name: Build HomeSmoke MQTT APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HomeSmoke branch
        uses: actions/checkout@v4
        with:
          ref: homesmoke-native

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Android 16 UI, input-dialog and sliding-sidebar fixes
        run: python3 ci/patch_android16_ui.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK and BIN
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.0.2_Android16.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.0.2_Android16.bin

      - name: Upload APK and BIN
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.0.2_Android16
          path: |
            dist/HomeSmoke_FULL_2.0.2_Android16.apk
            dist/HomeSmoke_FULL_2.0.2_Android16.bin
          if-no-files-found: error
