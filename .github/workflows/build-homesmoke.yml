name: Build HomeSmoke 2.6 stabilization

on:
  push:
    branches: [ homesmoke-native ]
  workflow_dispatch:

concurrency:
  group: homesmoke-native-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: homesmoke-native

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test shared protocol and Auto core
        run: gradle :core:test --stacktrace

      - name: Build modern HomeSmoke, existing Legacy and Remote
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :app:assembleDebug :legacy:assembleDebug :remote:assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish build result into branch
        shell: bash
        run: |
          mkdir -p dist
          cp build.log dist/build.log
          if [ "${{ steps.build.outputs.status }}" = "0" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.6.0_Android6plus.apk
            cp app/build/outputs/apk/debug/app-debug.apk dist/HomeSmoke_FULL_2.6.0_Android6plus.bin
            cp legacy/build/outputs/apk/debug/legacy-debug.apk dist/HomeSmoke_FULL_2.5.0_Android4plus.apk
            cp remote/build/outputs/apk/debug/remote-debug.apk dist/HomeSmoke_Remote_1.0.0_Android5plus.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "CI: publish HomeSmoke 2.6 stabilization [skip ci]" || true
          git pull --rebase origin homesmoke-native || true
          git push origin homesmoke-native

      - name: Fail workflow if build failed
        if: steps.build.outputs.status != '0'
        run: exit 1

      - name: Upload HomeSmoke 2.6 modern
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.6.0_Android6plus
          path: |
            dist/HomeSmoke_FULL_2.6.0_Android6plus.apk
            dist/HomeSmoke_FULL_2.6.0_Android6plus.bin
          if-no-files-found: error

      - name: Upload existing Android 4 legacy
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_FULL_2.5.0_Android4plus
          path: dist/HomeSmoke_FULL_2.5.0_Android4plus.apk
          if-no-files-found: error

      - name: Upload Remote
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: HomeSmoke_Remote_1.0.0_Android5plus
          path: dist/HomeSmoke_Remote_1.0.0_Android5plus.apk
          if-no-files-found: error
